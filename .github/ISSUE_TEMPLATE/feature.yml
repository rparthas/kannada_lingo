name: Feature
description: Track a feature, slice, or acceptance criterion
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issues are the source of truth for scope, status, and acceptance
        criteria. Add a milestone and area labels after creating the issue.
        See [docs/FEATURE_WORKFLOW.md](../blob/main/docs/FEATURE_WORKFLOW.md).
  - type: input
    id: learner-outcome
    attributes:
      label: Learner outcome
      description: One sentence the learner would say after using this.
      placeholder: I can record a phrase, replay it, and try again.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Testable checkboxes. Do not check one without evidence.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: principles
    attributes:
      label: Principles and boundaries
      description: Which mission or roadmap rules apply? What is explicitly out of scope?
      placeholder: Offline-first, no recordings leave the device, no pronunciation scoring.
    validations:
      required: false
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues, migrations, content versions, or device requirements.
      placeholder: Depends on #12. Migration 004. Physical iPhone required.
    validations:
      required: false
  - type: textarea
    id: touchpoints
    attributes:
      label: Code touchpoints
      description: Files or modules likely to change.
      placeholder: src/features/..., src-tauri/src/commands/..., tests/unit/...
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How will this be proven? Include the manual or device test when needed.
      placeholder: |
        Automated: npm test, cargo test
        Manual: physical iPhone, record -> stop -> replay -> retry
    validations:
      required: true
